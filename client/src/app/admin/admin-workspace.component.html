<div class="admin-shell">
  <header class="admin-topbar">
    <div class="admin-topbar__inner">
      <button #menuTrigger type="button" class="admin-button admin-menu-toggle"
        aria-haspopup="dialog" aria-controls="admin-mobile-menu" [attr.aria-expanded]="menuAberto()"
        (click)="abrirMenu()">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
        Menu
      </button>
      <a routerLink="/admin" class="admin-mark" aria-label="Xaquiamuni Produtos Naturais, visão geral administrativa">
        <span class="brand-crop brand-crop--symbol"><img src="/logo-xaquiamuni.jpeg" alt="" width="1024" height="1024" /></span>
        <span class="brand-crop brand-crop--wordmark"><img src="/logo-xaquiamuni.jpeg" alt="" width="1024" height="1024" /></span>
      </a>
      <button type="button" class="admin-button admin-signout" (click)="logout()"
        [disabled]="signingOut()" [attr.aria-busy]="signingOut()">
        {{ signingOut() ? 'Saindo...' : 'Sair' }}
      </button>
    </div>
  </header>

  <ng-template #navegacao let-mobile="mobile">
    <nav class="admin-nav" aria-label="Navegação administrativa">
      @for (grupo of grupos; track grupo.titulo) {
        <div class="admin-nav__group">
          @if (grupo.titulo) {
            <p class="admin-nav__label">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path [attr.d]="grupo.icone" /></svg>
              {{ grupo.titulo }}
            </p>
          }
          @for (item of grupo.itens; track item.pagina) {
            <a [routerLink]="item.rota"
              [class.is-current]="item.pagina === paginaAtual()"
              [attr.aria-current]="(item.pagina === paginaAtual()) ? 'page' : null"
              (click)="mobile && fecharMenu()">
              {{ item.nome }}
            </a>
          }
        </div>
      }
    </nav>
  </ng-template>

  <dialog #menu id="admin-mobile-menu" class="admin-drawer" aria-labelledby="admin-menu-title"
    (close)="menuFechado()" (click)="$event.target === menu && fecharMenu()">
    <div class="admin-drawer__body">
      <div class="admin-drawer__head">
        <h2 id="admin-menu-title">Administração</h2>
        <button #menuClose type="button" class="admin-button" (click)="fecharMenu()">Fechar</button>
      </div>
      @if (menuAberto()) {
        <ng-container *ngTemplateOutlet="navegacao; context: { mobile: true }" />
      }
    </div>
  </dialog>

  <div class="admin-grid">
    <aside class="admin-sidebar">
      <ng-container *ngTemplateOutlet="navegacao" />
    </aside>
    <main class="admin-content">
      @if (errorMessage()) {
        <p class="admin-feedback" role="alert">{{ errorMessage() }}</p>
      }
      <ng-content />
    </main>
  </div>
</div>
