<div class="min-h-screen bg-[#f5f7f1] text-slate-800">
  <header class="border-b border-emerald-950/10 bg-white">
    <div class="mx-auto flex max-w-7xl items-center justify-between gap-4 px-4 py-4 sm:px-6">
      <a routerLink="/admin"
        class="flex items-center gap-3 rounded-lg focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-emerald-800"
        aria-label="Xaquiamuni Produtos Naturais — painel administrativo">
        <span class="flex size-10 items-center justify-center rounded-2xl bg-emerald-800 text-white" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" class="size-6">
            <path d="M12 21v-9m0 4c-4.5 0-7-2.5-7-7 4.5 0 7 2.5 7 7Zm0-4c0-4.5 2.5-7 7-7 0 4.5-2.5 7-7 7Z" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </span>
        <span>
          <span class="block text-base font-semibold tracking-tight text-emerald-950">Xaquiamuni</span>
          <span class="block text-[0.65rem] tracking-wide text-slate-500">PAINEL ADMINISTRATIVO</span>
        </span>
      </a>
      <button type="button" (click)="logout()" [disabled]="signingOut()"
        [attr.aria-busy]="signingOut()"
        class="min-h-10 rounded-xl border border-emerald-800 px-4 py-2 text-sm font-semibold text-emerald-800 transition hover:bg-emerald-50 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-emerald-800 disabled:cursor-wait disabled:opacity-70">
        {{ signingOut() ? 'Saindo...' : 'Sair' }}
      </button>
    </div>
  </header>

  <div class="mx-auto grid max-w-7xl gap-6 px-4 py-6 sm:px-6 lg:grid-cols-[15rem_1fr] lg:py-10">
    <nav aria-label="Navegação administrativa" class="rounded-2xl border border-emerald-950/10 bg-white p-3 shadow-sm">
      <a routerLink="/admin" [attr.aria-current]="activePage() === 'overview' ? 'page' : null"
        [class]="activePage() === 'overview'
          ? 'flex min-h-11 items-center rounded-xl bg-emerald-50 px-4 text-sm font-semibold text-emerald-900'
          : 'flex min-h-11 items-center rounded-xl px-4 text-sm text-slate-600 hover:bg-emerald-50 focus-visible:outline-2 focus-visible:outline-emerald-800'">
        Visão geral
      </a>
      <div class="mt-2 flex min-h-11 items-center justify-between rounded-xl px-4 text-sm text-slate-500">
        <span>Produtos</span><span class="text-xs">Em breve</span>
      </div>
      <a routerLink="/admin/categorias" [attr.aria-current]="activePage() === 'categories' ? 'page' : null"
        [class]="activePage() === 'categories'
          ? 'mt-1 flex min-h-11 items-center rounded-xl bg-emerald-50 px-4 text-sm font-semibold text-emerald-900'
          : 'mt-1 flex min-h-11 items-center rounded-xl px-4 text-sm text-slate-600 hover:bg-emerald-50 focus-visible:outline-2 focus-visible:outline-emerald-800'">
        Categorias
      </a>
    </nav>

    <main class="min-w-0">
      @if (errorMessage()) {
        <p class="mb-4 rounded-xl border border-red-200 bg-white px-4 py-3 text-sm text-red-700"
          role="alert" aria-live="assertive">
          {{ errorMessage() }}
        </p>
      }
      <ng-content />
    </main>
  </div>
</div>
